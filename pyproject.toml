[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqs"
version = "1.0.0"
description = "Accuracy-Based Annotation Quality Score — Python 3 port of the MycoCosm/JGI Java tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
dependencies = [
    "biopython>=1.79",   # used for future BioPython integration; core algorithms use stdlib only
]

[project.scripts]
abaqs = "abaqs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["abaqs*"]

[tool.setuptools.package-data]
"abaqs.data" = ["*.txt", "*.prt", "*.gz"]
